name: Run VOLK tests

on: [push, pull_request]

jobs:
  build-ubuntu:
    name: Build on ${{ matrix.compiler.distro }} ${{ matrix.compiler.name }}

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: g++-11, cc: gcc-11, cxx: g++-11, distro: ubuntu-22.04 }
          # - { name: g++-11, cc: gcc-11, cxx: g++-11, distro: ubuntu-22.04-arm }
          - { name: g++-12, cc: gcc-12, cxx: g++-12, distro: ubuntu-22.04 }
          # - { name: g++-12, cc: gcc-12, cxx: g++-12, distro: ubuntu-22.04-arm }
          - { name: g++-13, cc: gcc-13, cxx: g++-13, distro: ubuntu-24.04 }
          - { name: g++-13, cc: gcc-13, cxx: g++-13, distro: ubuntu-24.04-arm }
          - { name: g++-14, cc: gcc-14, cxx: g++-14, distro: ubuntu-24.04 }
          - { name: g++-14, cc: gcc-14, cxx: g++-14, distro: ubuntu-24.04-arm }
          - { name: g++-15, cc: gcc-15, cxx: g++-15, distro: ubuntu-26.04 }
          - { name: g++-15, cc: gcc-15, cxx: g++-15, distro: ubuntu-26.04-arm }
          - { name: clang-14, cc: clang-14, cxx: clang++-14, distro: ubuntu-22.04 }
          # - { name: clang-14, cc: clang-14, cxx: clang++-14, distro: ubuntu-22.04-arm } # possibly broken runner: https://github.com/actions/runner-images/issues/8659
          - { name: clang-15, cc: clang-15, cxx: clang++-15, distro: ubuntu-22.04 }
          # - { name: clang-15, cc: clang-15, cxx: clang++-15, distro: ubuntu-22.04-arm }
          - { name: clang-16, cc: clang-16, cxx: clang++-16, distro: ubuntu-24.04 }
          - { name: clang-16, cc: clang-16, cxx: clang++-16, distro: ubuntu-24.04-arm }
          - { name: clang-17, cc: clang-17, cxx: clang++-17, distro: ubuntu-24.04 }
          - { name: clang-17, cc: clang-17, cxx: clang++-17, distro: ubuntu-24.04-arm }
          - { name: clang-18, cc: clang-18, cxx: clang++-18, distro: ubuntu-24.04 }
          - { name: clang-18, cc: clang-18, cxx: clang++-18, distro: ubuntu-24.04-arm }
          - { name: clang-19, cc: clang-19, cxx: clang++-19, distro: ubuntu-24.04 }
          - { name: clang-19, cc: clang-19, cxx: clang++-19, distro: ubuntu-24.04-arm }

    runs-on: ${{ matrix.compiler.distro }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"
      - name: Install dependencies
        run: sudo apt install python3-mako liborc-dev libgtest-dev libfmt-dev curl ${{ matrix.compiler.name }}
      - name: Install sccache
        shell: bash
        run: sudo scripts/ci/install_sccache.bash "${{ matrix.name }}"
        continue-on-error: true
      - name: Prepare sccache usage
        id: enable_sccache
        run: scripts/ci/setup_cmake_cache_flags.bash "${{ matrix.name }}"
      - name: Configure
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: >
          mkdir build \
          && cmake  \
            -S . \
            -B build \
            -DCMAKE_C_FLAGS="-Werror" \
            -DCMAKE_CXX_FLAGS="-Werror" \
            -DBUILD_EXECUTABLE=ON \
            ${{ steps.enable_sccache.outputs.CXX_LAUNCHER }} \
            ${{ steps.enable_sccache.outputs.C_LAUNCHER }}
      - name: Build
        run: |
          echo "Build with $(nproc)+1 thread(s)"
          cmake --build build -j$(( $(nproc) + 1 ))
      - name: Print info
        run: |
          if [ -f ./build/cpu_features/list_cpu_features ]; then
            ./build/cpu_features/list_cpu_features
          fi
          ./build/apps/volk-config-info --alignment
          ./build/apps/volk-config-info --avail-machines
          ./build/apps/volk-config-info --all-machines
          ./build/apps/volk-config-info --malloc
          ./build/apps/volk-config-info --cc
      - name: Test
        run: |
          cd build
          ctest -V
      - name: Show final sccache and build directory stats
        if: always()
        continue-on-error: true
        shell: bash
        run: scripts/ci/build-summary.sh "${{ matrix.name }}" "./build/"

  build-distro-platform-matrix:
    # The host should always be linux
    # see: https://github.com/uraimo/run-on-arch-action
    runs-on: ubuntu-22.04
    name: Non-x86 build on ${{ matrix.distro }} ${{ matrix.arch }} ${{ matrix.compiler.name }}

    # Run steps on a matrix of compilers and possibly archs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: armv7
            distro: ubuntu22.04
            compiler: { name: g++, cc: gcc, cxx: g++ }
            cmakeargs: "-DCMAKE_TOOLCHAIN_FILE=../cmake/Toolchains/arm_cortex_a72_hardfp_native.cmake"
          - arch: ppc64le
            distro: ubuntu22.04
            compiler: { name: g++-12, cc: gcc-12, cxx: g++-12 }
          - arch: s390x
            distro: ubuntu22.04
            compiler: { name: g++-12, cc: gcc-12, cxx: g++-12 }
          - arch: riscv64
            distro: ubuntu22.04
            compiler: { name: g++-12, cc: gcc-12, cxx: g++-12 }

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"
      - uses: uraimo/run-on-arch-action@v3
        # Wish I gotten sccache to work in this, but the environment provided by this 
        # action is so cursed that practically nothing works in there.
        name: Build in non-x86 container
        id: build
        with:
          arch: ${{ matrix.arch }}
          distro: ${{ matrix.distro }}

          # Not required, but speeds up builds
          githubToken: ${{ github.token }}

          setup: |
            mkdir -p "${PWD}/build"

          dockerRunArgs: |
            --volume "${PWD}:/volk"

          env: | # YAML, but pipe character is necessary
            CC: ${{ matrix.compiler.cc }}
            CXX: ${{ matrix.compiler.cxx }}

          shell: /bin/bash

          install: |
            case "${{ matrix.distro }}" in
              ubuntu*|jessie|stretch|buster|bullseye|trixie|forky)
                export DEBIAN_FRONTEND=noninteractive
                apt-get update -q -y
                apt-get install -q -y git cmake python3-mako liborc-dev libgtest-dev libfmt-dev ${{ matrix.compiler.name }}
                ;;
              fedora*)
                dnf -y update
                dnf -y install git which
                ;;
            esac

          run: |
            cd /volk
            echo "::group::cmake"
            cmake \
              -DCMAKE_C_FLAGS="-Werror" \
              -DCMAKE_CXX_FLAGS="-Werror" \
              -DBUILD_EXECUTABLE=ON \
              ${{ matrix.cmakeargs }} \
              -S . \
              -B build
            echo "::endgroup::"
            echo "::group::build"
            echo "Build with $(nproc)+1 thread(s)"
            cmake --build ./build -j$(( $(nproc) + 1 ))
            echo "::endgroup::"
            echo "::group::platform info"
            cd build
            if [ -f ./cpu_features/list_cpu_features ]; then
              ./cpu_features/list_cpu_features
            fi
            ./apps/volk-config-info --alignment
            ./apps/volk-config-info --avail-machines
            ./apps/volk-config-info --all-machines
            ./apps/volk-config-info --malloc
            ./apps/volk-config-info --cc
            echo "::endgroup::"
            echo "::group::tests"
            ctest -V
            echo "::endgroup::"

  build-ubuntu-static:
    name: Build static on ubuntu-22.04
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"
      - name: dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update >/dev/null \
          && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y python3-mako liborc-dev libgtest-dev libfmt-dev
      - name: Install sccache
        shell: bash
        run: sudo scripts/ci/install_sccache.bash "${{ matrix.name }}"
        continue-on-error: true
      - name: Prepare sccache usage
        id: enable_sccache
        run: scripts/ci/setup_cmake_cache_flags.bash "${{ matrix.name }}"
      - name: configure
        run: |
          mkdir build \
          && cmake \
            -S . \
            -B build \
            -DENABLE_STATIC_LIBS=True \
            -DCMAKE_C_FLAGS="-Werror" \
            -DCMAKE_CXX_FLAGS="-Werror" \
            -DBUILD_EXECUTABLE=ON \
            ${{ steps.enable_sccache.outputs.CXX_LAUNCHER }} \
            ${{ steps.enable_sccache.outputs.C_LAUNCHER }} \
      - name: build
        run: cmake --build build -j$(nproc)
      - name: Print info
        run: |
          ./build/cpu_features/list_cpu_features
          ./build/apps/volk-config-info --alignment
          ./build/apps/volk-config-info --avail-machines
          ./build/apps/volk-config-info --all-machines
          ./build/apps/volk-config-info --malloc
          ./build/apps/volk-config-info --cc
      - name: test
        run: cd build && ctest -V
      - name: Show final sccache and build directory stats
        if: always()
        continue-on-error: true
        shell: bash
        run: scripts/ci/build-summary.sh "${{ matrix.name }}" "./build/"

  build-ubuntu-static-dispatch:
    name: Build static dispatch on ubuntu-24.04
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - name: dependencies
        run: sudo apt install python3-mako libgtest-dev libfmt-dev
      - name: configure
        run: mkdir build && cd build && cmake -DVOLK_STATIC_DISPATCH=generic -DCMAKE_C_FLAGS="-Werror" -DCMAKE_CXX_FLAGS="-Werror" -DBUILD_EXECUTABLE=ON ..
      - name: build
        run: cmake --build build -j$(nproc)
      - name: Print info
        run: |
          ./build/apps/volk-config-info --alignment
          ./build/apps/volk-config-info --avail-machines
          ./build/apps/volk-config-info --all-machines
          ./build/apps/volk-config-info --malloc
          ./build/apps/volk-config-info --cc
      - name: test
        run: cd build && ctest -V

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: dependencies
        run: pip install mako
      - name: configure
        run: mkdir build && cd build && cmake -DPython3_FIND_REGISTRY=NEVER ..
      - name: build
        run: cmake --build build --config Release --target INSTALL -j4
      - name: test
        run: cd build && ctest -V -C Release


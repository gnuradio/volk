name: Build on Android NDK

on: [push, pull_request]

jobs:
  build:
    name: Build on Android NDK ${{ matrix.arch.name }}

    strategy:
      fail-fast: false
      matrix:
        arch:
          - { name: armeabi-v7a, allow_fail: false }
          - { name: arm64-v8a, allow_fail: false }
          - { name: x86, allow_fail: false }
          - { name: x86_64, allow_fail: false }

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Update repositories
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get update > /dev/null

      # All dependencies
      - name: Install dependencies
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake python3-mako libgtest-dev libfmt-dev curl

      - name: Install sccache
        shell: bash
        run: sudo scripts/ci/install_sccache.bash "${{ matrix.arch.name }}"
        continue-on-error: true

      - name: Prepare sccache usage
        id: enable_sccache
        run: scripts/ci/setup_cmake_cache_flags.bash "${{ matrix.name }}"

      # Setup Java
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      # Setup Android SDK, and auto-accept licenses
      - name: Install Android SDK
        run: wget --quiet --output-document=android-sdk.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip && mkdir android-sdk-linux && unzip -qq android-sdk.zip -d android-sdk-linux && export ANDROID_HOME=./android-sdk-linux && echo y | $ANDROID_HOME/cmdline-tools/bin/sdkmanager --sdk_root=android-sdk-linux --update && (echo y; echo y; echo y; echo y; echo y; echo y; echo y; echo y) | $ANDROID_HOME/cmdline-tools/bin/sdkmanager --sdk_root=android-sdk-linux --licenses

      # Call SDKManager to install the Android NDK
      - name: Install Android NDK
        run: $GITHUB_WORKSPACE/android-sdk-linux/cmdline-tools/bin/sdkmanager --sdk_root=$GITHUB_WORKSPACE/android-sdk-linux --install "ndk;27.2.12479018" --channel=3

      # Build fmt for the Android target. The host libfmt-dev package cannot
      # be used by the Android toolchain.
      - name: Install fmt and GoogleTest for Android
        shell: bash
        run: |
          git clone --depth 1 --branch 12.1.0 https://github.com/fmtlib/fmt.git fmt-src
          cmake -S fmt-src -B fmt-build \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/android-sdk-linux/ndk/27.2.12479018/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.arch.name }} \
            -DANDROID_PLATFORM=android-34 \
            -DFMT_TEST=OFF \
            -DFMT_DOC=OFF \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/android-fmt
          cmake --build fmt-build -j $(nproc)
          cmake --install fmt-build

          git clone --depth 1 --branch v1.18.0 https://github.com/google/googletest.git gtest-src
          cmake -S gtest-src -B gtest-build \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/android-sdk-linux/ndk/27.2.12479018/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.arch.name }} \
            -DANDROID_PLATFORM=android-34 \
            -DBUILD_GMOCK=OFF \
            -DINSTALL_GTEST=ON \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/android-gtest
          cmake --build gtest-build -j $(nproc)
          cmake --install gtest-build

      # Setup build directory
      - name: Setup ${{ matrix.arch.name }}
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/ \
          && mkdir build \
          && cmake -S . -B build \
          -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/android-sdk-linux/ndk/27.2.12479018/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=${{ matrix.arch.name }} \
          -DANDROID_PLATFORM=android-34 \
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/android-fmt;$GITHUB_WORKSPACE/android-gtest" \
          ${{ steps.enable_sccache.outputs.CXX_LAUNCHER }} \
          ${{ steps.enable_sccache.outputs.C_LAUNCHER }}

      # Build
      - name: Build ${{ matrix.arch.name }}
        shell: bash
        run: cmake --build build -j $(nproc)
        continue-on-error: ${{ matrix.arch.allow_fail }}

      - name: Show final sccache and build directory stats
        if: always()
        continue-on-error: true
        shell: bash
        run: scripts/ci/build-summary.sh "${{ matrix.arch.name }}" "./build/"
